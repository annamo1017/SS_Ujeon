<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>완두콩 뿌리 생장 – 세포분열 탐구 (2n=4)</title>
<style>
:root{--bg:#0e1116;--card:#1a1f29;--tx:#e8ecf2;--ac:#f5c518;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;touch-action:none;font-size:14px}
canvas{position:fixed;inset:0;width:100%;height:100%;transition:filter .15s}

.navb{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;width:50px;height:50px;border-radius:50%;padding:0;font-size:22px;background:#2b3342;color:#fff;display:inline-block;box-shadow:0 2px 10px rgba(0,0,0,.5)}#nhome{left:12px}#nmenu{right:12px}
#nav{position:fixed;inset:0;background:rgba(5,7,10,.8);z-index:50;align-items:center;justify-content:center;padding:12px}#nav .np{background:#161b24;border:1px solid #2f3848;border-radius:18px;padding:14px 16px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;touch-action:pan-y}
.nh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px}.navx{display:inline-block;background:#2b3342;color:#fff;padding:6px 12px;font-size:16px}
.ncols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ncols h4{margin:4px 0 8px;font-size:16px;color:#ffe37a}.ncols button{display:block;width:100%;margin:0 0 6px;text-align:left;font-size:14px;padding:9px 12px;background:#232a37;color:#e8ecf2;border-radius:10px}.ncols button.st{background:#3a2f0a;color:#ffe37a}
@media(max-width:560px){.ncols{grid-template-columns:1fr}}
#card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;max-width:620px;margin:auto;background:rgba(26,31,41,.93);border:1px solid #2b3342;border-radius:14px;padding:10px 14px;display:none;line-height:1.45}
#card b{color:var(--ac)}#pb{display:flex;gap:4px;margin-top:8px}.seg{flex:1;position:relative;height:24px;border-radius:7px;background:#232a37;overflow:hidden;border:1px solid #2f3848}.seg.go{cursor:pointer;border-color:#5b6b8c}.seg.cur{border-color:var(--ac)}.seg .f{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#b88a00,#f5c518);transition:width .2s}.seg em{position:relative;display:block;text-align:center;font-style:normal;font-size:11px;line-height:24px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}.gap{width:2px;background:#5b6b8c;border-radius:1px}
#pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:rgba(20,24,32,.94);border:2px solid var(--ac);border-radius:18px;padding:18px 28px;font-size:clamp(22px,6vw,34px);font-weight:800;color:#ffe37a;text-align:center;white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s;box-shadow:0 8px 40px rgba(245,197,24,.3)}#pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#pop .ne{font-size:clamp(18px,4.8vw,24px);color:#8ecae6;margin-top:8px}#pop{white-space:normal;max-width:92vw}#pop small{display:block;font-size:14px;color:#cbd5e1;font-weight:500;margin-top:4px}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:0;right:0;text-align:center}
#tip{font-size:18px;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);left:0;right:0;text-align:center;font-weight:600;color:#ffe37a;text-shadow:0 1px 6px #000;padding:0 12px}
button{font:inherit;background:var(--ac);color:#111;border:0;border-radius:24px;padding:12px 26px;font-weight:700;margin:4px;display:none}
#modes{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,16,.55);text-align:center;padding:16px}
#modes button{display:block;width:min(320px,90vw);margin:6px}
h2{margin:0 0 8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="card"></div><div id="tip"></div><div id="pop"></div>
<div id="bar"><button id="b1">🧬 복제하기</button><button id="b4">🧬 복제하기</button><button id="b5">🚫 복제하지 않기</button><button id="b2">🌱 뿌리가 자라는 모습 보기</button><button id="b3">↺ 다시 하기</button></div>
<button id="nhome" class="navb" title="처음으로">🏠</button><button id="nmenu" class="navb" title="단계 이동">☰</button>
<div id="nav" style="display:none"><div class="np"><div class="nh"><b>단계 바로 가기</b><button id="nx" class="navx">✕</button></div><div class="ncols"><div><h4>🌱 체세포분열</h4><div id="nl1"></div></div><div><h4>🌼 생식세포분열</h4><div id="nl2"></div></div></div></div></div>
<div id="modes"><h2>어떤 세포분열을 탐구할까요?</h2><p style="margin:0 0 12px;font-size:18px;font-weight:700;color:#ffe37a">2n=4 모델 (긴 염색체 1쌍 + 짧은 염색체 1쌍)</p><button id="m1">🌱 체세포분열 – 뿌리 끝 생장 (2n→2n)</button><button id="m2">🌼 생식세포분열 – 꽃과 자가수분 (2n→n)</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let W,H,cx,cy,rx,ry,L;
