<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>완두콩 뿌리 생장 – 세포분열 탐구 (2n=4)</title>
<script>window.addEventListener('load',function(){setTimeout(function(){if(!window.__ok){var e=document.getElementById('loadchk');if(e){e.style.display='block';}}},1500);});</script>
<style>
:root{--bg:#0e1116;--card:#1a1f29;--tx:#e8ecf2;--ac:#f5c518;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;font-size:14px}
canvas{position:fixed;inset:0;width:100%;height:100%;transition:filter .15s}

.navb{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;width:50px;height:50px;border-radius:50%;padding:0;font-size:22px;background:#2b3342;color:#fff;display:inline-block;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#nhome{left:12px}
#nmenu{right:12px}
#nav{position:fixed;inset:0;background:rgba(5,7,10,.8);z-index:50;align-items:center;justify-content:center;padding:12px}
#nav .np{background:#161b24;border:1px solid #2f3848;border-radius:18px;padding:14px 16px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;touch-action:pan-y}
.nh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px}
.navx{display:inline-block;background:#2b3342;color:#fff;padding:6px 12px;font-size:16px}
.ncols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ncols h4{margin:4px 0 8px;font-size:16px;color:#ffe37a}
.ncols button{display:block;width:100%;margin:0 0 6px;text-align:left;font-size:14px;padding:9px 12px;background:#232a37;color:#e8ecf2;border-radius:10px}
.ncols button.st{background:#3a2f0a;color:#ffe37a}
@media(max-width:560px){.ncols{grid-template-columns:1fr}
}
#card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;max-width:620px;margin:auto;background:rgba(26,31,41,.93);border:1px solid #2b3342;border-radius:14px;padding:10px 14px;display:none;line-height:1.45}
#card b{color:var(--ac)}
#pb{display:flex;gap:4px;margin-top:8px}
.seg{flex:1;position:relative;height:24px;border-radius:7px;background:#232a37;overflow:hidden;border:1px solid #2f3848}
.seg.go{cursor:pointer;border-color:#5b6b8c}
.seg.cur{border-color:var(--ac)}
