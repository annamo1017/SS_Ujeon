<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>완두콩 뿌리 생장 – 세포분열 탐구 (2n=4)</title>
<style>
:root{--bg:#0e1116;--card:#1a1f29;--tx:#e8ecf2;--ac:#f5c518;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;touch-action:none;font-size:14px}
canvas{position:fixed;inset:0;width:100%;height:100%;transition:filter .15s}

.navb{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;width:50px;height:50px;border-radius:50%;padding:0;font-size:22px;background:#2b3342;color:#fff;display:inline-block;box-shadow:0 2px 10px rgba(0,0,0,.5)}#nhome{left:12px}#nmenu{right:12px}
#nav{position:fixed;inset:0;background:rgba(5,7,10,.8);z-index:50;align-items:center;justify-content:center;padding:12px}#nav .np{background:#161b24;border:1px solid #2f3848;border-radius:18px;padding:14px 16px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;touch-action:pan-y}
.nh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px}.navx{display:inline-block;background:#2b3342;color:#fff;padding:6px 12px;font-size:16px}
.ncols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ncols h4{margin:4px 0 8px;font-size:16px;color:#ffe37a}.ncols button{display:block;width:100%;margin:0 0 6px;text-align:left;font-size:14px;padding:9px 12px;background:#232a37;color:#e8ecf2;border-radius:10px}.ncols button.st{background:#3a2f0a;color:#ffe37a}
@media(max-width:560px){.ncols{grid-template-columns:1fr}}
#card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;max-width:620px;margin:auto;background:rgba(26,31,41,.93);border:1px solid #2b3342;border-radius:14px;padding:10px 14px;display:none;line-height:1.45}
#card b{color:var(--ac)}#pb{display:flex;gap:4px;margin-top:8px}.seg{flex:1;position:relative;height:24px;border-radius:7px;background:#232a37;overflow:hidden;border:1px solid #2f3848}.seg.go{cursor:pointer;border-color:#5b6b8c}.seg.cur{border-color:var(--ac)}.seg .f{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#b88a00,#f5c518);transition:width .2s}.seg em{position:relative;display:block;text-align:center;font-style:normal;font-size:11px;line-height:24px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}.gap{width:2px;background:#5b6b8c;border-radius:1px}
#pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:rgba(20,24,32,.94);border:2px solid var(--ac);border-radius:18px;padding:18px 28px;font-size:clamp(22px,6vw,34px);font-weight:800;color:#ffe37a;text-align:center;white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s;box-shadow:0 8px 40px rgba(245,197,24,.3)}#pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#pop .ne{font-size:clamp(18px,4.8vw,24px);color:#8ecae6;margin-top:8px}#pop{white-space:normal;max-width:92vw}#pop small{display:block;font-size:14px;color:#cbd5e1;font-weight:500;margin-top:4px}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:0;right:0;text-align:center}
#tip{font-size:18px;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);left:0;right:0;text-align:center;font-weight:600;color:#ffe37a;text-shadow:0 1px 6px #000;padding:0 12px}
button{font:inherit;background:var(--ac);color:#111;border:0;border-radius:24px;padding:12px 26px;font-weight:700;margin:4px;display:none}
#modes{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,16,.55);text-align:center;padding:16px}
#modes button{display:block;width:min(320px,90vw);margin:6px}
h2{margin:0 0 8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="card"></div><div id="tip"></div><div id="pop"></div>
<div id="bar"><button id="b1">🧬 복제하기</button><button id="b4">🧬 복제하기</button><button id="b5">🚫 복제하지 않기</button><button id="b2">🌱 뿌리가 자라는 모습 보기</button><button id="b3">↺ 다시 하기</button></div>
<button id="nhome" class="navb" title="처음으로">🏠</button><button id="nmenu" class="navb" title="단계 이동">☰</button>
<div id="nav" style="display:none"><div class="np"><div class="nh"><b>단계 바로 가기</b><button id="nx" class="navx">✕</button></div><div class="ncols"><div><h4>🌱 체세포분열</h4><div id="nl1"></div></div><div><h4>🌼 생식세포분열</h4><div id="nl2"></div></div></div></div></div>
<div id="modes"><h2>어떤 세포분열을 탐구할까요?</h2><p style="margin:0 0 12px;font-size:18px;font-weight:700;color:#ffe37a">2n=4 모델 (긴 염색체 1쌍 + 짧은 염색체 1쌍)</p><button id="m1">🌱 체세포분열 – 뿌리 끝 생장 (2n→2n)</button><button id="m2">🌼 생식세포분열 – 꽃과 자가수분 (2n→n)</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let W,H,cx,cy,rx,ry,L;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);ry=Math.min(H*.28,W*.34);rx=Math.min(ry*1.4,W*.47);cx=W/2;cy=H*.54;L=rx*.68}
addEventListener('resize',rs);rs();
let ph='choose',fz=0,sp=0,ft=0,m2=false,cy2=0,rt=false,mode='mit',step=0,cond=0,prog=0,sep=0,cyt=0,zt=0,ot=0,ch=[],dr=null,lp=null,la=null,conf=[],lastT=0,tk=0,pt=0;
const T=[['간기 ① 염색사 분류','풀어진 염색사 4줄을 끌어 <b>긴 염색체 구역(A/a)</b>과 <b>짧은 염색체 구역(B/b)</b>에 넣으세요.'],
['간기 ② DNA 복제','<b>복제하기</b> 버튼을 눌러 염색사와 유전자를 복제하세요. (A-A, a-a, B-B, b-b)'],
['전기 · 염색체 응축','염색사 <b>하나하나</b> 위에서 손가락/마우스로 <b>동글동글 돌려</b> 각각 X자 염색체로 응축시키세요.'],
['전기 · 방추사 부착','전기 후반, 핵막이 사라지고 세포 양쪽 극에서 방추사가 뻗어 나와요. <span style="color:#a3d977">(식물 세포에는 중심체가 없어요)</span> 각 염색체의 <b>동원체(●)</b>를 눌러 연결하세요.'],
['중기 · 적도면 정렬','방추사가 매달린 염색체를 끌어 세포 <b>가운데(적도면)</b>에 정렬하세요.'],
['후기','방추사를 당기듯 화면을 <b>좌우로 문질러</b> 보세요. '],
['말기 ① 세포판 형성','적도면에 작은 주머니(소낭)들이 모여 <b>세포판</b>이 만들어져요. 가운데 점선을 <b>위아래로 쓸어</b> 세포판을 키워 딸세포 2개로 나누세요. <span style="color:#a3d977">(식물 세포는 세포벽 때문에 세포막이 잘록해지지 않아요)</span>'],
['말기 ② 핵막 형성','각 염색체 위에서 <b>동글동글 돌려</b> 하나씩 염색사로 풀면 핵막이 완성됩니다.']];
const MS=[0,1,2,13,14,15,16,17,23,18,22,19,20,21];function nx(){return mode=='mit'?step+1:MS[MS.indexOf(step)+1]}
T[13]=['전기 I · 상동염색체 접합','같은 길이의 <b>상동 염색체끼리</b> 끌어다 붙이세요. 동원체(●)를 사이에 두고 좌우로 붙은 <b>2가염색체(>●<)</b>가 됩니다.'];
T[14]=['전기 I · 방추사 부착','전기 후반, 방추사가 뻗어 나와요. 각 상동 염색체의 <b>동원체(●)</b>를 눌러 연결하세요. 상동 염색체는 <b>서로 반대쪽 극</b>에 연결됩니다.'];
T[15]=['중기 I · 적도면 정렬','<b>2가염색체(상동 염색체 쌍)</b>를 끌어 가운데 <b>점선(적도면)</b>에 배열하세요. 짝이 함께 움직여요.'];
T[16]=['후기 I · 상동염색체 분리','좌우로 문질러 <b>상동 염색체를 분리</b>해 양극으로 보내세요. (염색분체는 붙어 있어요)'];
T[17]=['말기 I · 세포판 형성','적도면에 소낭이 모여 <b>세포판</b>이 생겨요. 가운데 점선을 <b>위아래로 쓸어</b> 세포판을 키워 <b>딸세포 2개</b>로 나누세요. 이후 DNA 복제 없이 감수 2분열이 이어집니다.'];
T[23]=['전기 II · 복제 여부 확인','감수 2분열을 시작하기 전, DNA를 <b>복제해야 할까요?</b> 아래 버튼 중 하나를 골라 보세요.'];
T[18]=['전기 II · 방추사 부착','DNA 복제 없이 감수 2분열 시작! 두 딸세포에 방추사가 <b>위아래 극</b>에서 생겼어요. 가로로 누운 X자 염색체의 <b>동원체(●)</b>를 눌러 연결하세요.'];
T[22]=['중기 II · 적도면 정렬','방추사가 붙은 염색체를 끌어 각 딸세포의 <b>가로 중앙선(적도면)</b>에 정렬하세요.'];
T[19]=['후기 II · 염색분체 분리','화면을 <b>위아래로 문질러</b> 자매 염색분체를 분리해 양극으로 당기세요.'];
T[20]=['말기 II · 세포판 형성','각 딸세포 가운데의 가로 점선을 <b>좌우로 쓸어</b> 세포판을 만들어 <b>딸세포 4개(n=2)</b>를 만드세요. <span style="color:#a3d977">(식물 세포는 세포벽 때문에 세포막이 잘록해지지 않아요)</span>'];
T[21]=['말기 II · 핵막 형성','각 염색체 위에서 <b>동글동글 돌려</b> 염색사로 풀면 핵막이 만들어집니다.'];
const ZY=[-.42,.42],SL=[-.42,-.14,.14,.42];
let ac;function snd(f,d=.15,ty='sine',v=.1,f2){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
function tip(s,ms=2200){$('tip').textContent=s;clearTimeout(tip.t);tip.t=setTimeout(()=>$('tip').textContent='',ms)}
function init(){ch=[['#ef4444','A',1,0],['#3b82f6','a',1,0],['#22c55e','B',.5,1],['#facc15','b',.5,1]].map((o,i)=>{const c={c:o[0],n:o[1],len:o[2],z:o[3],i,x:cx+(Math.random()-.5)*rx*.9,y:cy+(Math.random()-.5)*ry*.9,rep:0,att:0,side:0,ok:0,cd:0};clamp(c);c.tx=c.x;c.ty=c.y;return c});cond=prog=sep=cyt=cy2=0;m2=false}
const LS=c=>c.len*L*(m2?.55:1),LC=c=>c.len*L*.5,EX=c=>((step>=3&&step<21)||step==22||step==23)&&step!=7&&step!=99?LC(c):LS(c);
function mpos(){const gp=8,o=[2,0,1,3],hs=o.map(i=>LC(ch[i])),tot=hs.reduce((a,b)=>a+b,0)+gp*3;let y=cy-tot/2;const r=[];o.forEach((i,k)=>{r[i]=y+hs[k]/2;y+=hs[k]+gp});return r}
function vtc(c){return !m2&&EX(c)==LC(c)}
function hit(c,x,y){const h=Math.max(EX(c)/2,20)+14;return vtc(c)?Math.abs(x-c.x)<Math.max(34,h*.8)&&Math.abs(y-c.y)<h:Math.abs(x-c.x)<h&&Math.abs(y-c.y)<30}
function clamp(c){if(m2){const a=rx*.5-EX(c)/2-8,b=ry-34,dc=cx+c.side*rx*.5;let dx=(c.x-dc)/a,dy=(c.y-cy)/b,d=Math.hypot(dx,dy);if(d>1){c.x=dc+dx/d*a;c.y=cy+dy/d*b}return}const a=rx-EX(c)/2-10,b=vtc(c)?ry-EX(c)/2-10:ry-16;let dx=(c.x-cx)/a,dy=(c.y-cy)/b,d=Math.hypot(dx,dy);if(d>1){c.x=cx+dx/d*a;c.y=cy+dy/d*b}}
const PH={mit:[['간기',[0,1]],['전기',[2,3]],['중기',[4]],['후기',[5]],['말기',[6,7]]],
mei:[['간기',[0,1]],['전기Ⅰ',[2,13,14]],['중기Ⅰ',[15]],['후기Ⅰ',[16]],['말기Ⅰ',[17]],0,['전기Ⅱ',[23,18]],['중기Ⅱ',[22]],['후기Ⅱ',[19]],['말기Ⅱ',[20,21]]]};
let snaps={},segs=[];
const NE={'전기':'🔹 핵막 소실 · 인 소실','전기Ⅰ':'🔹 핵막 소실 · 인 소실','말기':'🔸 핵막 재형성 · 인 재형성','말기Ⅱ':'🔸 핵막 재형성 · 인 재형성'};
function pop(t,sub,ne){const e=$('pop');e.innerHTML=t+(ne?'<div class="ne">'+ne+'</div>':'')+(sub?'<small>'+sub+'</small>':'');e.classList.add('on');snd(523,.12,'triangle',.12);setTimeout(()=>snd(784,.25,'triangle',.12),110);clearTimeout(pop.t);pop.t=setTimeout(()=>e.classList.remove('on'),ne?2300:1500)}
function phN(k){const q=PH[mode].find(q=>q&&q[1].includes(k));return q?q[0]:''}
function ord(k){return mode=='mit'?k:MS.indexOf(k)}
function stepFrac(){const n4=f=>ch.filter(f).length/4,av=ch.reduce((u,k)=>u+k.cd,0)/4;
return({0:n4(c=>c.ok),2:av,13:n4(c=>c.ok),3:n4(c=>c.att),14:n4(c=>c.att),18:n4(c=>c.att),4:n4(c=>c.ok),22:n4(c=>c.ok),5:sep,16:sep,19:sep,6:cyt,17:cyt,20:cy2,7:1-av,21:1-av})[step]||0}
function gauge(){if(ph!='play')return;const cur=ord(step);segs.forEach(o=>{const st=o.st,i0=ord(st[0]),i1=ord(st[st.length-1]);let f;
if(step==99||cur>i1)f=1;else if(cur<i0)f=0;else f=(st.indexOf(step)+Math.min(1,stepFrac()))/st.length;o.f.style.width=(f*100)+'%';o.el.classList.toggle('cur',step!=99&&cur>=i0&&cur<=i1);o.el.classList.toggle('go',true)})}
function goBack(t){const sn=snaps[t];if(!sn)return;ch=JSON.parse(sn.ch);sep=sn.sep;cyt=sn.cyt;cy2=sn.cy2;cond=sn.cond;dr=null;step=sn.prev;$('b2').style.display='none';$('tip').textContent='';setStep(t,1);snd(330,.2,'sine',.1,220)}
function setStep(n,quiet){if(!quiet&&ph=='play'&&step!=n&&T[step]&&n!=0)phN(step)==phN(n)?pop('✔ '+T[step][0].split(' · ').pop(),T[step][0]):pop(phN(step)+' 완료!',T[step][0],NE[phN(step)]);
snaps[n]={ch:JSON.stringify(ch),sep,cyt,cy2,cond,prev:step};
step=n;prog=0;la=null;m2=mode=='mei'&&[18,22,19,20,21].includes(n);if(n==2)ch.forEach(c=>c.cd=0);if(n==7||n==21){ch.forEach(c=>c.cd=1);cond=1}if(n==21)ch.forEach(c=>{c.tx=cx+c.side*rx*.5+(c.z?.2:-.1)*rx;c.ty=cy});if(n==7)ch.forEach(c=>c.ty=cy+(c.ty-cy)*.75);if([4,13,15,22].includes(n))ch.forEach(c=>c.ok=0);if(n==18)ch.forEach(c=>c.att=0);if(n==5)ch.forEach(c=>{c.tx=cx;c.x=cx});
if(n==18){ch.forEach(c=>{c.x+=c.side*rx*.5;c.tx=cx+c.side*rx*.5+(c.z?1:-1)*rx*.15;c.ty=cy+(c.z?-.4:.3)*ry});sep=0;cyt=1;cy2=0}
$('card').style.display='block';let d=T[n][1];if(n==5)d+=mode=='mit'?'자매 염색분체가 갈라져 V자로 양극으로 이동합니다.':'상동 염색체가 갈라져 양극으로 이동합니다(감수 1분열).';
$('card').innerHTML='<b>'+T[n][0]+'</b> · '+(mode=='mit'?'체세포분열':'생식세포분열')+'<br>'+d+'<div id="pb">'+PH[mode].map(q=>q?'<div class="seg" data-s="'+q[1][0]+'"><span class="f"></span><em>'+q[0]+'</em></div>':'<div class="gap"></div>').join('')+'</div>';
segs=[...$('card').querySelectorAll('.seg')].map((el,i)=>{const st=PH[mode].filter(Boolean)[i][1];el.onclick=()=>{if(st[0]!=step)jumpStep(mode,st[0])};return{el,st,f:el.querySelector('.f')}});gauge();
$('b1').style.display=n==1?'inline-block':'none';$('b4').style.display=$('b5').style.display=n==23?'inline-block':'none';$('b2').style.display='none';
if(n==3&&mode=='mit'){const Y=mpos();ch.forEach((c,i)=>{c.tx=cx+[-.2,.17,-.12,.22][i]*rx;c.ty=Y[i]})}else if(n==13)ch.forEach((c,i)=>{c.tx=cx+(i%2?1:-1)*rx*(.28+.08*i);c.ty=cy+SL[i]*ry;clamp({x:0,y:0,len:c.len})});
if(n==5||n==13){ch[0].side=-1;ch[1].side=1;const r=Math.random()<.5?-1:1;ch[2].side=r;ch[3].side=-r}}
$('b4').onclick=()=>{snd(160,.35,'sawtooth',.1,90);pop('✖ 복제하지 않아요!','감수 1분열과 2분열 사이에는 간기(DNA 복제)가 없어요.<br>각 염색체는 이미 염색분체 2개로 되어 있어요.')};
$('b5').onclick=()=>{$('b4').style.display=$('b5').style.display='none';tip('정답! DNA 복제 없이 바로 감수 2분열을 시작해요.',3000);setStep(18)};
function ok(){snd(660,.25,'sine',.12,990)}

if(bl>0){const r=fr*bl;for(let k=0;k<5;k++){const a=k/5*6.283-1.57;g.globalAlpha=1;g.fillStyle=k%2?'#fdf2f8':'#fce7f3';g.strokeStyle='#f9a8d4';g.lineWidth=Math.max(1,r*.02);g.beginPath();g.ellipse(hx+Math.cos(a)*r*.75,hy+Math.sin(a)*r*.75,r*.55,r*.32,a,0,7);g.fill();g.stroke()}
g.fillStyle='#14532d';g.beginPath();g.arc(hx,hy+r*.05,r*.62,0,7);g.fill();
g.fillStyle='#65a30d';g.strokeStyle='#1a2e05';g.lineWidth=Math.max(1,r*.025);g.beginPath();g.ellipse(hx,hy+r*.55,r*.26,r*.32,0,0,7);g.fill();g.stroke();
g.strokeStyle='#a3e635';g.lineWidth=Math.max(1.5,r*.09);g.lineCap='round';g.beginPath();g.moveTo(hx,hy+r*.26);g.lineTo(hx,hy-r*.42);g.stroke();
g.fillStyle='#d9f99d';g.strokeStyle='#365314';g.lineWidth=Math.max(1,r*.025);g.beginPath();g.ellipse(hx,hy-r*.5,r*.17,r*.1,0,0,7);g.fill();g.stroke();g.fillStyle='#65a30d';for(let q=-2;q<=2;q++){g.beginPath();g.arc(hx+q*r*.06,hy-r*.52,r*.018,0,7);g.fill()}
for(const s of[-1,1]){g.strokeStyle='#fef3c7';g.lineWidth=Math.max(1,r*.035);g.beginPath();g.moveTo(hx+s*r*.12,hy+r*.3);g.quadraticCurveTo(hx+s*r*.5,hy+r*.15,hx+s*r*.55,hy-r*.18);g.stroke();
g.fillStyle='#f59e0b';g.strokeStyle='#78350f';g.lineWidth=Math.max(1,r*.025);g.beginPath();g.ellipse(hx+s*r*.55,hy-r*.26,r*.1,r*.15,0,0,7);g.fill();g.stroke();g.strokeStyle='#78350f';g.beginPath();g.moveTo(hx+s*r*.55,hy-r*.4);g.lineTo(hx+s*r*.55,hy-r*.12);g.stroke()}
if(bl>=1&&sc<4){const f=Math.max(9,13/sc);g.globalAlpha=Math.max(0,1-(sc-1)/3);g.font='700 '+f+'px sans-serif';g.textAlign='left';g.lineWidth=1;
[['암술머리',hx+r*.2,hy-r*.62,'#d9f99d',hx+r*.12,hy-r*.52],['암술대',hx+r*.95,hy+r*.05,'#a3e635',hx+r*.05,hy-r*.05],['씨방',hx+r*.95,hy+r*.6,'#84cc16',hx+r*.26,hy+r*.55],['꽃밥(수술)',hx-r*1.55,hy-r*.75,'#f59e0b',hx-r*.6,hy-r*.35],['수술대',hx-r*1.4,hy+r*.35,'#fef3c7',hx-r*.45,hy+r*.12]].forEach(t=>{g.strokeStyle=t[3];g.beginPath();g.moveTo(t[1]+(t[1]<hx?g.measureText(t[0]).width:0),t[2]-f*.3);g.lineTo(t[4],t[5]);g.stroke();g.lineWidth=3;g.strokeStyle='#000';g.strokeText(t[0],t[1],t[2]);g.lineWidth=1;g.fillStyle=t[3];g.fillText(t[0],t[1],t[2])});g.globalAlpha=1}}}
function mini(x,y,l,k){const n=l.length;l.forEach((c,i)=>{const yy=y+(i-(n-1)/2)*7*k,ln=c.len*14*k;g.globalAlpha=1;g.strokeStyle=c.c;g.lineWidth=2.4*k;g.lineCap='round';g.beginPath();g.moveTo(x-ln/2,yy);g.lineTo(x+ln/2,yy);g.stroke();badge(x-ln*.2,yy,c.n,1,3.2*k)})}

const sp1=ch.filter(c=>c.side==-1),eg=ch.filter(c=>c.side==1),t=Math.max(0,Math.min(1,(ft-.2)/.5)),u=Math.max(0,Math.min(1,(ft-.7)/.15));

// input
let sc=null;
function pts(c){const D=m2?ry*.5:rx*.5;return sep>0?(m2?[[c.x,c.y-sep*D],[c.x,c.y+sep*D]]:mode=='mit'?[[c.x-sep*D,c.y-4],[c.x+sep*D,c.y+4]]:[[c.x+c.side*sep*D,c.y]]):[[c.x,c.y]]}

const a=Math.atan2(y-p[1],x-p[0]);if(la!=null&&Math.hypot(x-p[0],y-p[1])>10){let d=a-la;if(d>Math.PI)d-=6.283;if(d<-Math.PI)d+=6.283;const q=Math.abs(d)/(3*Math.PI);c.cd=Math.max(0,Math.min(1,c.cd+(step==2?q:-q)));cond=ch.reduce((u,k)=>u+k.cd,0)/4;if(pt-tk>.09){tk=pt;snd(200+c.cd*500,.09,'sine',.05)}

if(ph!='play')return;

else if(step==5||step==16||step==19){sep=Math.min(1,sep+(step==19?Math.abs(dy)/(ry*.9):Math.abs(dx)/(rx*.9)));if(pt-tk>.08){tk=pt;snd(500-sep*300,.15,'sawtooth',.04,150)}if(sep>=1){setStep(nx());ok()}}
else if(step==6||step==17||step==20){const v=(Math.abs(dx)+Math.abs(dy))/(ry*2.4);if(step==20)cy2=Math.min(1,cy2+v);else cyt=Math.min(1,cyt+v);if(pt-tk>.1){tk=pt;snd(250+(cyt+cy2)*200,.1,'triangle',.05)}if((step==20?cy2:cyt)>=1){setStep(nx());ok()}}});

else if(step==15){const p=ch[i^1];if(Math.abs((c.x+p.x)/2-cx)<.22*rx){[c,p].forEach(q=>{q.tx=cx+q.side*8;q.ty=cy+(q.z?.3:-.3)*ry;q.ok=1});snd(440,.12,'triangle',.1);if(ch.every(k=>k.ok)){ok();setTimeout(()=>setStep(nx()),500)}}else tip('2가염색체를 적도면(가운데)으로!')}

lp=null;la=null}

(function ease(){requestAnimationFrame(ease);ch.forEach(c=>{if(dr&&dr.c==c)return;c.x+=(c.tx-c.x)*.18;c.y+=(c.ty-c.y)*.18})})();
