<style>

#pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:rgba(20,24,32,.94);border:2px solid var(--ac);border-radius:18px;padding:18px 28px;font-size:clamp(22px,6vw,34px);font-weight:800;color:#ffe37a;text-align:center;white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s;box-shadow:0 8px 40px rgba(245,197,24,.3)}#pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#pop .ne{font-size:clamp(18px,4.8vw,24px);color:#8ecae6;margin-top:8px}#pop{white-space:normal;max-width:92vw}#pop small{display:block;font-size:14px;color:#cbd5e1;font-weight:500;margin-top:4px}

.opts{width:100%;max-width:520px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.opts button{margin:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(96px,30vw,160px);background:#1a1f29;color:#e8ecf2;border:2px solid #2f3848;border-radius:16px;padding:10px 6px;font-size:14px;line-height:1.3}.opts button svg{width:70%}.opts button.ok{border-color:#22c55e;background:#14361f}.opts button.no{border-color:#ef4444;background:#3b1414}
.verdict{font-size:22px;font-weight:800;margin:16px 0 8px;color:#ffe37a}.law{max-width:560px;background:#1a1f29;border:2px solid var(--ac);border-radius:18px;padding:16px;text-align:left;font-size:17px;line-height:1.6}.law .lt{font-size:26px;font-weight:900;color:#ffe37a;text-align:center;margin-bottom:6px}

#dgo{display:inline-block;margin-top:14px}

.chip.past{color:#ffe37a!important;border-color:#8a6d00!important}.chip.on{background:var(--ac)!important;color:#111!important;border-color:var(--ac)!important}
#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:none;gap:8px;align-items:center;background:rgba(20,24,32,.92);border:1px solid #2f3848;border-radius:30px;padding:6px 10px;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.5)}#ctl button{display:inline-block;margin:0;width:54px;height:42px;padding:0;font-size:22px;background:#2b3342;color:#fff;border-radius:21px;line-height:1}#ctl button.on{background:var(--ac);color:#111}#cSpd{font-size:15px;font-weight:700;color:#ffe37a;min-width:52px;text-align:center}#pop.bp{padding:26px 22px;border-width:3px;white-space:normal;width:min(88vw,460px);box-sizing:border-box}#pop.bp .t{font-size:clamp(30px,9vw,46px)}
#modes button small{font-size:13px;opacity:.8}

#spol{left:2%}#segg{right:2%;background:#fce7f3;border-color:#ec4899}
#stage.go #spol{left:calc(50% - 50px)}#stage.go #segg{right:calc(50% - 50px)}#stage.fz .gmt{opacity:0;transform:scale(.5)}
#szyg{position:absolute;left:50%;top:6px;width:80px;height:80px;margin-left:-40px;border-radius:50%;background:#fef3c7;border:4px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;opacity:0;transform:scale(.3);transition:all .45s cubic-bezier(.3,1.6,.5,1);color:#111}

.gmt .R,#szyg .R{color:#dc2626}.gmt .r,#szyg .r{color:#2563eb}.gmt .Y,#szyg .Y{color:#b45309}.gmt .y,#szyg .y{color:#15803d}
#qtxt{font-size:16px;min-height:44px;padding:0 6px;line-height:1.45;display:block}
#inp,#phs{min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center}#phs{flex-direction:row;flex-wrap:wrap}
#gtbox{display:inline-flex;min-width:130px;height:42px;align-items:center;justify-content:center;border:2px dashed #5b6b8c;border-radius:10px;font-size:26px;font-weight:900;letter-spacing:2px;margin:4px 0;background:#1a1f29}
#keys button,#phs button,#auto{display:inline-block;margin:3px}
#keys button{min-width:50px;font-size:22px;padding:8px 12px;background:#e8ecf2}#keys .kb{background:#475569;color:#fff}
#phs button{display:inline-flex;flex-direction:column;align-items:center;width:calc(25% - 6px);max-width:112px;margin:3px!important;padding:6px 2px;box-sizing:border-box;background:#1a1f29;color:#e8ecf2;border:2px solid #2f3848;border-radius:12px;font-size:14px;font-weight:700;line-height:1.25}#phs button svg{width:42px}
#phs button.no{border-color:#ef4444;animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#auto{display:none;background:#2b3342;color:#e8ecf2;padding:8px 16px;font-size:14px;margin-top:6px!important}
.shake{animation:sh .3s}
#cgrid{display:grid;gap:4px;margin:12px auto 10px}#cgrid>div{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,3.4vw,17px)}
.cc{background:#232a37;border:2px dashed #3b4658;color:#5b6b8c}.cc.cur{border:3px solid var(--ac);color:#ffe37a;animation:pl 1s infinite}@keyframes pl{50%{box-shadow:0 0 14px rgba(245,197,24,.7)}}
.cc.done{background:#1f2937;border:2px solid #f5c518;animation:pp .35s}.cc.done svg{width:48%}
#bins{display:flex;gap:6px;width:100%;max-width:560px;justify-content:center;flex-wrap:wrap}.bin{flex:1;min-width:70px;background:#1a1f29;border:1px solid #2f3848;border-radius:12px;padding:6px 4px}.bin .bn{font-size:13px;color:#e2e8f0;font-weight:600}.bin .bc{font-size:22px;font-weight:900;color:#ffe37a}.bin .bi{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:18px}.bin .bi svg{width:16px}.bin.hit{border-color:var(--ac)}
#cres{max-width:560px;width:100%;line-height:1.65;font-size:16px}#cres .box{background:#1a1f29;border:1px solid #2f3848;border-radius:12px;padding:12px;margin:8px 0}#cres .big{font-size:22px;font-weight:800;color:#ffe37a}#cres button{display:inline-block;margin:4px}
@media (min-width:900px){#case[style*="flex"]{display:grid!important;grid-template-columns:minmax(380px,460px) minmax(440px,580px);grid-template-areas:"top grid" "top bins" "res res";justify-content:center;align-content:start;column-gap:28px;row-gap:8px}
#ctop{grid-area:top;align-self:start}#cgrid{grid-area:grid;margin:0}#bins{grid-area:bins;max-width:none}#cres{grid-area:res;justify-self:center;max-width:720px}#qtxt{font-size:18px}#stage{height:110px}}
#pun{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;touch-action:pan-y;background:rgba(10,12,16,.96);padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
#pun .sub{margin:0 0 12px;font-size:15px}.R{color:#f87171}.r{color:#60a5fa}.Y{color:#fbbf24}.y{color:#4ade80}.gm .R{color:#dc2626}.gm .r{color:#2563eb}.gm .Y{color:#b45309}.gm .y{color:#15803d}
.opts.four{display:grid;grid-template-columns:1fr 1fr;max-width:340px;justify-items:center}.opts.four button{width:100%}
.ph4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.ph4>div{background:#0e1116;border-radius:10px;padding:6px 2px;font-size:12px}.ph4 svg{width:60%}.ph4 b{display:block;font-size:22px;color:#ffe37a}
#grid{display:grid;grid-template-columns:repeat(5,clamp(58px,17.4vw,100px));gap:4px}#fillall{display:inline-block;background:#2b3342;color:#e8ecf2;margin-top:10px;padding:8px 18px}
#grid>div{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(12px,3.4vw,17px)}
.hd{background:#1a1f29;border:1px solid #2f3848;font-size:13px!important}.hd span{font-size:12px;font-weight:600;color:#cbd5e1}
.gm{width:62%;font-size:clamp(12px,3.5vw,17px)!important;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,24px);background:#fff8dc;border:3px solid}
.cellq{background:#232a37;border:2px dashed #5b6b8c;cursor:pointer;color:#8fa0c0}.cellq:hover{border-color:var(--ac)}
.celld{background:#1f2937;border:2px solid var(--ac);animation:pp .35s}.celld svg{width:48%}.celld small{font-size:11px;color:#cbd5e1;font-weight:600}
@keyframes pp{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
#res{max-width:520px;margin-top:14px;line-height:1.6;font-size:15px}#res .box{background:#1a1f29;border:1px solid #2f3848;border-radius:12px;padding:12px;margin:8px 0}
#res .big{font-size:20px;font-weight:800;color:#ffe37a}
#res button,#again{display:inline-block}#again{display:none;margin-top:10px}
.qz button{background:#2b3342;color:#e8ecf2;margin:4px}.qz button.ok{background:#16a34a;color:#fff}.qz button.no{background:#7f1d1d;color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div id="card"></div><div id="tip"></div><div id="pop"></div>
<div id="bar"><button id="b1">🧬 복제하기</button><button id="b4">🧬 복제하기</button><button id="b5">🚫 복제하지 않기</button><button id="b6">✨ 감수분열로 생식세포 만들기</button><button id="b7">⏭ 건너뛰기</button><button id="b8">🔄 짧은 염색체 쌍(Y/y) 방향 바꾸기</button><button id="b9">① R–Y 같은 쪽으로 배열</button><button id="b10">② R–y 같은 쪽으로 배열</button><button id="b11">🔄 다른 배열로도 해 보기</button><button id="b2">🧮 퍼넷 사각형으로 자가수분</button><button id="b3">↺ 다시 하기</button></div>
<div id="modes"><h2>🫛 완두콩 유전 탐구</h2><p style="margin:0 0 14px;opacity:.85;max-width:440px">순종 완두를 교배해 잡종 1대(F₁)를 만들고, F₁의 감수분열과 자가수분으로 잡종 2대(F₂)가 어떻게 나타나는지 직접 알아봐요.</p><button id="m1">① 우열의 법칙 · 분리의 법칙<br><small style="font-weight:500">단성잡종 · 둥근(R) / 주름진(r)</small></button><button id="m2">② 독립의 법칙<br><small style="font-weight:500">양성잡종 · 둥근(R)/주름진(r) + 황색(Y)/녹색(y)</small></button></div>
<div id="tbar"><button id="thome" class="chip" style="background:#3a2f0a!important;color:#ffe37a!important" title="처음 화면">🏠 처음</button><div id="chips"></div></div><div id="ctl"><button id="cRew" title="뒤로 감기">⏪</button><button id="cPlay" title="멈춤/재생">❚❚</button><button id="cFf" title="빨리 감기">⏩</button><span id="cSpd">×1</span></div><div id="dom"></div><div id="case"><div id="ctop"><h2 id="ctitle"></h2><div id="stage"><div class="gmt" id="spol" data-l="꽃가루(정핵)"></div><div class="gmt" id="segg" data-l="난세포"></div><div id="szyg">?</div></div><div id="qtxt"></div><div id="inp"><div id="gtbox"></div><div id="keys"></div></div><div id="phs"></div><button id="auto">⚡ 나머지는 자동으로 채우기</button></div><div id="cgrid"></div><div id="bins"></div><div id="cres"></div></div><div id="pun"><h2>F₁(RrYy) 자가수분 · 퍼넷 사각형</h2><p class="sub">생식세포 4종류가 만나요. 빈 칸을 눌러 수정시키세요!</p><div id="grid"></div><button id="fillall">⚡ 나머지 한 번에 채우기</button><div id="res"></div><button id="again">↺ 처음부터 다시</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let W,H,cx,cy,rx,ry,L;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);ry=Math.min(H*.28,W*.34);rx=Math.min(ry*1.4,W*.47);cx=W/2;cy=H*.54;L=rx*.68}
addEventListener('resize',rs);rs();
let ph='choose',fz=0,sp=0,ft=0,m2=false,cy2=0,rt=false,mode='mit',step=0,cond=0,prog=0,sep=0,cyt=0,zt=0,ot=0,ch=[],dr=null,lp=null,la=null,conf=[],lastT=0,tk=0,pt=0;
const T=[['간기 ① 염색사 분류','F₁(RrYy) 꽃밥 속 세포예요. <b class="R">빨강 계열</b>은 둥근·황색 완두(RRYY), <b class="r">파랑 계열</b>은 주름진·녹색 완두(rryy)에게서 받은 염색체예요. 4줄을 끌어 <b>긴 염색체 구역(R/r)</b>과 <b>짧은 염색체 구역(Y/y)</b>에 넣으세요.'],
['간기 ② DNA 복제','<b>복제하기</b> 버튼을 눌러 염색사와 유전자를 복제하세요. (R-R, r-r, Y-Y, y-y)'],
['전기 · 염색체 응축','염색사 <b>하나하나</b> 위에서 손가락/마우스로 <b>동글동글 돌려</b> 각각 X자 염색체로 응축시키세요.'],
['전기 · 방추사 부착','전기 후반, 핵막이 사라지고 양끝 중심체에서 방추사가 뻗어 나와요. 각 염색체의 <b>동원체(●)</b>를 눌러 연결하세요.'],
['중기 · 적도면 정렬','방추사가 매달린 염색체를 끌어 세포 <b>가운데(적도면)</b>에 정렬하세요.'],
['후기','방추사를 당기듯 화면을 <b>좌우로 문질러</b> 보세요. '],
['말기 ① 세포질 분열','세포 가운데의 잘록한 부분을 <b>위아래로 쓸어</b> 세포막을 오목하게 만들어 딸세포 2개로 나누세요.'],
['말기 ② 핵막 형성','각 염색체 위에서 <b>동글동글 돌려</b> 하나씩 염색사로 풀면 핵막이 완성됩니다.']];
const MS=[0,1,2,13,14,15,16,17,23,18,22,19,20,21];function nx(){return mode=='mit'?step+1:MS[MS.indexOf(step)+1]}
