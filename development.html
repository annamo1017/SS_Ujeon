['mc','정자와 난자가 주로 만나는 곳은?',['난소','나팔관','자궁','질'],1,'수정은 주로 나팔관에서 일어나요.'],['mc','사람 체세포의 염색체 수는?',['23개','44개','46개','92개'],2,'23쌍, 46개예요.'],['mc','사람 정자의 염색체 수는?',['22개','23개','44개','46개'],1,'생식세포는 23개예요.'],['mc','아기의 성별을 결정하는 것은?',['난자의 X 염색체','정자가 가진 X 또는 Y 염색체','엄마의 나이','착상 위치'],1,'정자가 X면 딸, Y면 아들이에요.'],['mc','여자 체세포의 성염색체 구성은?',['XX','XY','YY','X'],0,'여자는 XX, 남자는 XY예요.'],['mc','수정란이 세포 분열을 빠르게 거듭하는 초기 과정은?',['난할','감수 분열','착상','배란'],0,'수정란의 초기 세포 분열을 난할이라 해요.'],['mc','세포들이 뽕나무 열매처럼 뭉친 시기는?',['포배','상실배','수정란','태아'],1,'상실(桑實)=뽕나무 열매예요.'],['mc','배아가 자궁 내막에 파묻히는 것은?',['배란','수정','착상','출산'],2,'착상 후 임신이 시작돼요.'],['mc','아빠 AO, 엄마 BO일 때 나올 수 없는 혈액형은?',['A형','B형','AB형','없다 (모두 가능)'],3,'A, B, AB, O 모두 가능해요.'],['mc','아빠 AA, 엄마 OO일 때 아이의 혈액형은?',['A형','O형','AB형','A형 또는 O형'],0,'아빠에게서 A, 엄마에게서 O → AO, A형이에요.'],['mc','아빠 AB, 엄마 OO일 때 나올 수 있는 혈액형은?',['A형 또는 B형','AB형','O형','A·B·AB·O 모두'],0,'아빠의 A 또는 B + 엄마의 O → A형 또는 B형이에요.'],['mc','아들이 태어날 확률은?',['25%','50%','75%','100%'],1,'정자가 X 또는 Y일 확률이 반반이에요.'],['mc','상동 염색체에 대한 설명으로 옳은 것은?',['크기와 모양이 같은 한 쌍의 염색체','복제되어 붙어 있는 두 가닥','성염색체에만 있는 것','세포마다 수가 다른 것'],0,'복제되어 붙은 두 가닥은 염색 분체예요.'],['mc','큰 것부터 차례대로 바르게 나열한 것은?',['염색체 > DNA > 유전자','유전자 > DNA > 염색체','DNA > 염색체 > 유전자','염색체 > 유전자 > DNA'],0,'염색체 안에 DNA가, DNA의 일부분이 유전자예요.'],['mc','형제자매의 형질이 서로 다른 까닭은?',['물려받는 유전자 조합이 달라서','태어난 순서 때문에','유전자가 저절로 바뀌어서','먹는 음식 때문에'],0,'부모에게서 받는 유전자 조합이 자녀마다 달라요.'],['mc','생식세포를 만드는 세포 분열은?',['체세포 분열','감수 분열','난할','착상'],1,'감수 분열로 염색체 수가 절반이 돼요.'],['mc','266일은 언제부터 센 기간일까?',['수정된 날부터','착상한 날부터','출산 예정일부터 거꾸로','태어난 날부터'],0,'수정 후 약 266일(38주)이에요.'],['mc','포배에 대한 설명으로 옳은 것은?',['속이 빈 공 모양으로 자궁 내막에 착상한다','정자와 난자가 만난 직후의 세포 1개이다','난소에서 만들어진다','염색체가 23개이다'],0,'포배가 자궁 내막에 착상해요.'],['mc','염색체가 뚜렷해 수를 세기 좋은 때는?',['세포가 분열할 때','세포가 쉬고 있을 때','배란될 때','출산할 때'],0,'분열할 때 염색사가 응축해 염색체가 돼요.'],['mc','정자의 머리 부분에 들어 있는 것은?',['유전 물질이 든 핵','꼬리','난황','아무것도 없다'],0,'머리에 핵이 있어 아빠의 염색체 23개를 전해요.']];
let CQ=null;
ENTER.chal=()=>{CQ={list:QB.slice().sort(()=>Math.random()-.5).slice(0,10),i:0,score:0,combo:0,maxc:0,ok:0};chalQ()};DRAW.chal=()=>{bgDark()};
function chalQ(){clearInterval(CHT);const q=CQ.list[CQ.i];let left=15,ans=false;const opts=q[0]=='ox'?['⭕ 맞다','❌ 틀리다']:q[2];
ui('<div class="panel center" style="width:960px"><div style="display:flex;justify-content:space-between;font-size:22px;font-weight:800"><span>🏆 문제 도전 '+(CQ.i+1)+' / 10</span><span>🔥 '+CQ.combo+'연속 · 점수 <b style="color:#ffd43b">'+CQ.score+'</b></span></div><div style="height:10px;background:#1f2633;border-radius:6px;margin:12px 0"><div id="cbar" style="height:100%;width:100%;background:#ffd43b;border-radius:6px;transition:width 1s linear"></div></div><h2 style="font-size:32px;line-height:1.45;margin:16px 0">'+q[1]+'</h2><div class="qo" id="cqo">'+opts.map((o,i)=>'<button data-i="'+i+'">'+o+'</button>').join('')+'</div><div id="cqf" style="font-size:22px;margin-top:14px;min-height:80px;line-height:1.5"></div></div>');
const fin=(i)=>{if(ans)return;ans=true;clearInterval(CHT);const corr=q[0]=='ox'?(q[2]?0:1):q[3],ok=i===corr;document.querySelectorAll('#cqo button').forEach(b=>{const k=+b.dataset.i;if(k==corr)b.classList.add('ok');else if(k==i)b.classList.add('no')});
let g2=0;if(ok){CQ.combo++;CQ.ok++;CQ.maxc=Math.max(CQ.maxc,CQ.combo);g2=Math.round((100+left*5)*(1+.1*(CQ.combo-1)));CQ.score+=g2;snd(880,.2,'sine',.12)}else{CQ.combo=0;snd(160,.3,'sawtooth',.08)}
$('cqf').innerHTML=(ok?'✅ +'+g2+'점! ':i==null?'⏰ 시간 초과! ':'❌ ')+q[q[0]=='ox'?3:4]+'<br><button id="cnx" style="margin-top:10px">'+(CQ.i<9?'다음 문제 ▶':'결과 보기 ▶')+'</button>';$('cnx').onclick=()=>{CQ.i++;CQ.i<10?chalQ():chalEnd()}};
document.querySelectorAll('#cqo button').forEach(b=>b.onclick=()=>fin(+b.dataset.i));requestAnimationFrame(()=>{const e=$('cbar');if(e)e.style.width=(left-1)/15*100+'%'});
CHT=setInterval(()=>{left--;const e=$('cbar');if(e)e.style.width=Math.max(0,left-1)/15*100+'%';if(left<=0)fin(null)},1000)}
function chalEnd(){const s=CQ.score,gr=s>=1700?'S':s>=1300?'A':s>=900?'B':'C',nb=s>SS.best;if(nb)SS.best=s;SS.quizBestCombo=Math.max(SS.quizBestCombo||0,CQ.maxc);saveSS();addPts(Math.round(s/10),'문제 도전');if(s>=1500)badge('quiz');if(CQ.maxc>=10)badge('combo');fanfare();
ui('<div class="panel center" style="width:760px;text-align:center"><h2>🏆 문제 도전 결과</h2><p style="font-size:110px;font-weight:900;color:#ffd43b;line-height:1.1;margin:10px 0">'+gr+'</p><p style="font-size:28px">'+CQ.ok+' / 10 정답 · 최대 '+CQ.maxc+'연속 · <b style="color:#ffd43b">'+s+'점</b></p><p style="font-size:21px;color:#cbd5e1;margin:8px 0 18px">'+(nb?'🎉 새 최고 기록!':'최고 기록: '+SS.best+'점')+'</p><div style="display:flex;gap:12px;justify-content:center"><button id="cre">🔄 다시 도전</button><button class="g" id="cho">⌂ 처음 화면</button></div></div>');$('cre').onclick=()=>go('chal');$('cho').onclick=()=>go('title')}

const FAQ=[['정자는 수억 개나 되는데 왜 하나만 수정되나요?','정자 하나가 난자 속으로 들어가면 곧바로 난자 표면이 바뀌어 다른 정자가 더 들어오지 못해요. 그래서 보통 정자 하나와 난자 하나가 만나 수정란이 돼요.'],['아기의 성별은 누가 결정하나요?','난자는 항상 X 염색체를 가지고 있어요. 정자가 X를 가지고 있으면 XX(딸), Y를 가지고 있으면 XY(아들)가 돼요. 그래서 아들·딸 확률은 거의 반반이에요.'],['쌍둥이는 어떻게 생기나요?','일란성 쌍둥이는 수정란 하나가 둘로 나뉘어 생겨서 유전자가 같아요. 이란성 쌍둥이는 난자 두 개가 각각 다른 정자와 수정해서 생기므로, 보통 형제자매처럼 서로 달라요.'],['상동 염색체와 염색 분체는 어떻게 다른가요?','상동 염색체는 아빠에게서 1개, 엄마에게서 1개 받은 크기·모양이 같은 한 쌍이에요. 염색 분체는 염색체 하나가 복제되어 동원체에서 붙어 있는 두 가닥이라 유전 정보가 완전히 같아요.'],['같은 부모인데 형제자매는 왜 서로 다르게 생겼나요?','부모는 각 상동 염색체 쌍 중 하나씩만 자녀에게 전해요. 어느 쪽이 전해질지는 아이마다 달라서, 형제자매의 유전자 조합이 달라져요. 게임의 윷놀이가 바로 이 과정이에요!'],['아이 혈액형이 엄마 아빠 둘 다와 다를 수 있나요?','네! 예를 들어 A형(AO) 아빠와 B형(BO) 엄마 사이에서는 AB형이나 O형 아이도 태어날 수 있어요.'],['눈 색깔이나 얼굴형은 정말 유전자 하나로 정해지나요?','아니요. 실제로는 여러 유전자가 함께 작용하고 환경의 영향도 받아요. 이 게임의 홍채·눈썹·귓불·얼굴형 규칙과 염색체 위치는 원리를 이해하기 위한 가상 설정이에요.'],['아기는 수정 후 얼마 만에 태어나나요?','수정된 날로부터 약 266일(38주)이에요. 병원에서 흔히 말하는 "임신 40주"는 마지막 월경을 시작한 날부터 센 것이라 2주 정도 차이가 나요.'],['착상은 언제 일어나나요?','수정 후 약 6~7일, 일주일 무렵이에요. 그동안 수정란은 난할을 하며 나팔관을 따라 자궁으로 내려와요.'],['난할을 하면 왜 세포가 점점 작아지나요?','난할은 세포가 자랄 시간 없이 분열만 빠르게 반복하기 때문이에요. 그래서 세포 수는 늘어도 배아 전체 크기는 거의 그대로이고, 세포 하나는 작아져요.'],['상실배와 포배는 어떻게 다른가요?','상실배는 세포들이 뽕나무 열매처럼 꽉 뭉친 모양이고, 포배는 그 안에 빈 공간이 생긴 공 모양이에요. 자궁 내막에 착상하는 것은 포배예요.'],['자궁외 임신은 무엇인가요?','수정란이 자궁이 아닌 곳(대부분 나팔관)에 착상하는 것으로, 위험할 수 있어 병원 치료가 필요해요. 원인은 여러 가지이고, 게임에서는 단순화해서 표현했어요.'],['술이나 담배가 정말 정자에 영향을 주나요?','흡연과 음주가 정자의 수나 움직임을 줄일 수 있다는 연구 결과들이 있어요. 다만 게임 속 속도 숫자는 실제 값이 아니라 가상의 효과예요.'],['사람의 염색체는 왜 하필 23쌍인가요?','생물의 종마다 염색체 수가 정해져 있어요. 사람은 23쌍(46개)이고, 침팬지는 24쌍, 개는 39쌍이에요. 수가 같다고 같은 종인 것은 아니에요.']];

function hashCode(t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(-5)}
function wrapText(c,t,x,y,w,lh){let line='';for(const ch of t){if(c.measureText(line+ch).width>w){c.fillText(line,x,y);y+=lh;line=ch}else line+=ch}c.fillText(line,x,y);return y+lh}

x.fillStyle='#0f1520';x.fillRect(0,0,1000,1300);x.fillStyle='#ffd43b';x.fillRect(0,0,1000,120);x.fillStyle='#111';x.font=F(900,46);x.fillText('🧬 23쌍의 비밀 · 학습 기록 카드',40,76);
x.fillStyle='#e8ecf2';x.font=F(800,34);x.fillText(nm,40,180);x.font=F(400,22);x.fillStyle='#9aa6b2';x.fillText(new Date().toLocaleDateString('ko-KR'),40,215);
x.fillStyle='#ffd43b';x.font=F(900,64);x.textAlign='right';x.fillText(SS.pts.toLocaleString()+'점',960,200);x.textAlign='left';
x.font=F(700,24);x.fillStyle='#e8ecf2';x.fillText('🏆 문제 도전 최고 '+SS.best+'점   🎯 예측 '+SS.predOk+'/'+SS.predN+'   🏅 업적 '+SS.badges.length+'/'+BADGES.length,40,270);
x.font=F(400,30);let bx=40;SS.badges.forEach(id=>{const b=BADGES.find(q=>q[0]==id);x.fillText(b[1],bx,320);bx+=46});
x.fillStyle='#ffd43b';x.font=F(800,28);x.fillText('👶 우리 가족 아이들 ('+FAM.length+'명)',40,390);
const hd=['','이름','성별','홍채','혈액형','얼굴형','눈썹','귓불'],cw=[110,150,110,110,110,120,120,120];let yy=440;x.font=F(700,21);x.fillStyle='#9aa6b2';let cx2=40;hd.forEach((h,i)=>{x.fillText(h,cx2,yy);cx2+=cw[i]});
x.fillStyle='#e8ecf2';x.font=F(400,21);FAM.slice(0,12).forEach((k,j)=>{yy+=38;cx2=40;[ordOf(j),k.name,k.ph.sex=='XX'?'딸 XX':'아들 XY',k.ph.eye,k.ph.blood+'형',k.ph.face,k.ph.brow||'둥근',k.ph.ear||'분리형'].forEach((v,i)=>{x.fillText(String(v),cx2,yy);cx2+=cw[i]})});
yy+=60;x.fillStyle='#ffd43b';x.font=F(800,28);x.fillText('✍️ 오늘 알게 된 것',40,yy);x.fillStyle='#e8ecf2';x.font=F(400,26);yy=wrapText(x,rf||'(작성하지 않음)',40,yy+44,920,40);
x.fillStyle='#4b5563';x.font=F(400,18);x.fillText('확인 코드 '+hashCode(nm+SS.pts+FAM.length+SS.best),40,1270);x.textAlign='right';x.fillText('※ 홍채·눈썹·귓불·얼굴형 유전 규칙은 학습용 가상 설정이에요',960,1270);x.textAlign='left';
const url=c.toDataURL('image/png');modal('<h2 style="text-align:center">📄 학습 기록 카드</h2><img src="'+url+'" style="width:100%;border-radius:14px;margin:10px 0" alt="학습 기록 카드"><div style="display:flex;gap:12px;justify-content:center"><a href="'+url+'" download="학습기록카드_'+nm.replace(/\\s/g,'_')+'.png"><button>💾 이미지 저장</button></a><button class="g" id="mcl">닫기</button></div><p class="note" style="text-align:center;margin-top:8px">저장이 안 되면 카드 이미지를 길게 눌러 저장하거나 화면을 캡처해 제출하세요.</p>');$('mcl').onclick=closeModal;addPts(SS.badges.includes('card')?0:0,'')}};DRAW.card=()=>{bgDark()};
